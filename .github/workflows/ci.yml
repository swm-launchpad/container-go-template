name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all_templates:
        description: 'Validate all templates (skip change detection)'
        required: false
        type: boolean
        default: false
  workflow_call:

env:
  GO_VERSION: '1.25.3'

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (diff를 위해)

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: scripts/go.sum

      - name: Download dependencies
        run: |
          cd scripts
          go mod download

      - name: Detect changed templates
        id: changed
        run: |
          # Force validate all templates (manual trigger)
          if [ "${{ github.event.inputs.force_all_templates }}" == "true" ]; then
            echo "🔍 Force validate all templates (manual trigger)"
            TEMPLATE_CHANGES=$(cat test-projects/mappings.json | jq -r 'keys[]' | sort -u)
            CHANGED_JSON=$(echo "$TEMPLATE_CHANGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "changed_templates=$CHANGED_JSON" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT

            echo "### Force Validate All Templates" >> $GITHUB_STEP_SUMMARY
            echo "Manual trigger - validating all templates" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$TEMPLATE_CHANGES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # 이벤트 타입에 따라 BASE_SHA/HEAD_SHA 설정
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_call" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            # workflow_dispatch에서 github.event.before는 비어있음
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "null" ]; then
              BASE_SHA="HEAD^"
            fi
          else
            echo "❌ Unsupported event type: ${{ github.event_name }}"
            exit 1
          fi

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA || true)

          # 1. templates/ 직접 변경
          TEMPLATE_CHANGES=$(echo "$CHANGED_FILES" | grep '^templates/' | cut -d'/' -f2 | sort -u || true)

          # 2. test-projects/ 변경 → mappings.json에서 실제 템플릿 키 찾기
          TEST_PROJECT_CHANGES=$(echo "$CHANGED_FILES" | grep '^test-projects/' | grep -v '^test-projects/mappings.json' || true)
          if [ -n "$TEST_PROJECT_CHANGES" ]; then
            # Create path -> template mapping from mappings.json
            PATH_TO_TEMPLATE=$(cat test-projects/mappings.json | jq -r '
              to_entries[] |
              (
                if .value.test_projects then
                  .value.test_projects[] | (.path + " " + .key)
                elif .value.test_project then
                  .value.test_project + " " + .key
                else empty end
              )
            ')

            # Find which templates are affected by changed files
            AFFECTED_TEMPLATES=""
            while IFS= read -r changed_file; do
              while IFS=' ' read -r test_path template_key; do
                if [[ "$changed_file" == "$test_path"* ]]; then
                  AFFECTED_TEMPLATES=$(echo -e "$AFFECTED_TEMPLATES\n$template_key")
                fi
              done <<< "$PATH_TO_TEMPLATE"
            done <<< "$TEST_PROJECT_CHANGES"

            AFFECTED_TEMPLATES=$(echo "$AFFECTED_TEMPLATES" | grep -v '^$' | sort -u)
            TEMPLATE_CHANGES=$(echo -e "$TEMPLATE_CHANGES\n$AFFECTED_TEMPLATES" | grep -v '^$' | sort -u)
          fi

          # 3. scripts/ 변경 → 모든 템플릿 검증
          SCRIPTS_CHANGED=$(echo "$CHANGED_FILES" | grep '^scripts/' || true)
          if [ -n "$SCRIPTS_CHANGED" ]; then
            echo "Scripts changed - validating all templates"
            TEMPLATE_CHANGES=$(cat test-projects/mappings.json | jq -r 'keys[]' | sort)
          fi

          # 4. test-projects/mappings.json 변경 → 모든 템플릿 검증
          MAPPINGS_CHANGED=$(echo "$CHANGED_FILES" | grep '^test-projects/mappings.json$' || true)
          if [ -n "$MAPPINGS_CHANGED" ]; then
            echo "Mappings file changed - validating all templates"
            TEMPLATE_CHANGES=$(cat test-projects/mappings.json | jq -r 'keys[]' | sort)
          fi

          if [ -z "$TEMPLATE_CHANGES" ]; then
            echo "changed_templates=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            CHANGED_JSON=$(echo "$TEMPLATE_CHANGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "changed_templates=$CHANGED_JSON" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT

            echo "### Changed Templates" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$TEMPLATE_CHANGES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate changed templates
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cd scripts

          # Convert template names to paths for migration validator
          CHANGED_PATHS=$(echo '${{ steps.changed.outputs.changed_templates }}' | \
            jq -c 'map("../templates/" + .)')

          go run generate-migration.go \
            --changed "$CHANGED_PATHS" \
            --validate-only

      - name: Validate template rendering
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cd scripts

          # Convert template names array to comma-separated list
          CHANGED_TEMPLATES=$(echo '${{ steps.changed.outputs.changed_templates }}' | \
            jq -r '.[]' | \
            paste -sd ',' -)

          echo "Testing template rendering for: $CHANGED_TEMPLATES"
          go run validate-templates.go \
            --templates "$CHANGED_TEMPLATES" \
            --skip-build

      - name: Docker build and runtime validation (changed templates)
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cd scripts

          # Convert template names array to comma-separated list
          CHANGED_TEMPLATES=$(echo '${{ steps.changed.outputs.changed_templates }}' | \
            jq -r '.[]' | \
            paste -sd ',' -)

          echo "Testing Docker builds and runtime for: $CHANGED_TEMPLATES"
          go run validate-templates.go \
            --templates "$CHANGED_TEMPLATES" \
            --run-test \
            --timeout 20m \
            --verbose

      - name: Test migration generation
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cd scripts

          # Convert template names to paths for migration generator
          CHANGED_PATHS=$(echo '${{ steps.changed.outputs.changed_templates }}' | \
            jq -c 'map("../templates/" + .)')

          go run generate-migration.go \
            --changed "$CHANGED_PATHS" \
            --output /tmp/test-migration.sql \
            --version test-${{ github.event.pull_request.number }}

          echo "### Generated Migration Preview" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          head -100 /tmp/test-migration.sql >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Count lines
          LINES=$(wc -l < /tmp/test-migration.sql)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total lines:** $LINES" >> $GITHUB_STEP_SUMMARY

      - name: No changes detected
        if: steps.changed.outputs.has_changes != 'true'
        run: |
          echo "✅ No template changes detected - validation skipped"
          echo "### No Template Changes" >> $GITHUB_STEP_SUMMARY
          echo "No templates were modified in this PR" >> $GITHUB_STEP_SUMMARY

      - name: Validation summary
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          echo "✅ All validations passed!"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Validation Complete" >> $GITHUB_STEP_SUMMARY
          echo "All changed templates are valid and migration SQL generated successfully" >> $GITHUB_STEP_SUMMARY
