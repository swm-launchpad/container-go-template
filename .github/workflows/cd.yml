name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all_templates:
        description: 'Force deploy all templates (use after DB reset)'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.25.3'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-to-production:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: scripts/go.sum

      - name: Detect changed and deleted templates
        id: changed
        run: |
          # 수동 트리거에서 force_all_templates=true인 경우 모든 템플릿 포함
          if [ "${{ github.event.inputs.force_all_templates }}" == "true" ]; then
            echo "all_templates=true" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Force deploy all templates (manual trigger)"
            exit 0
          fi

          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          # workflow_dispatch (push 아님) 시 github.event.before는 비어있음
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" == "null" ]; then
            BASE_SHA="HEAD^"
          fi

          # 첫 커밋인 경우 모든 템플릿 포함
          if [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
            echo "all_templates=true" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ First commit - including all templates"
            exit 0
          fi

          # 변경/추가된 템플릿 감지
          CHANGED_DIRS=$(git diff --name-only $BASE_SHA $HEAD_SHA | \
            grep '^templates/' | \
            cut -d'/' -f1,2 | \
            sort -u || true)

          # 삭제된 템플릿 디렉토리 감지
          DELETED_DIRS=$(git diff --name-only --diff-filter=D $BASE_SHA $HEAD_SHA | \
            grep '^templates/' | \
            cut -d'/' -f1,2 | \
            sort -u || true)

          # 삭제된 템플릿의 이름 추출 (이전 커밋의 metadata.json에서)
          DELETED_NAMES=""
          if [ -n "$DELETED_DIRS" ]; then
            DELETED_NAMES=$(for dir in $DELETED_DIRS; do
              git show $BASE_SHA:$dir/metadata.json 2>/dev/null | jq -r '.name' || echo ""
            done | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')

            if [ "$DELETED_NAMES" == "[]" ] || [ -z "$DELETED_NAMES" ]; then
              DELETED_NAMES=""
            fi
          fi

          # 변경 또는 삭제가 있는지 확인
          if [ -z "$CHANGED_DIRS" ] && [ -z "$DELETED_NAMES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️  No template changes detected - skipping deployment"
            exit 0
          fi

          CHANGED_JSON=$(echo "$CHANGED_DIRS" | jq -R -s -c 'split("\n") | map(select(length > 0)) | map("../" + .)')

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "changed_templates=$CHANGED_JSON" >> $GITHUB_OUTPUT
          echo "deleted_templates=$DELETED_NAMES" >> $GITHUB_OUTPUT

          echo "✅ Template changes detected:"
          if [ -n "$CHANGED_DIRS" ]; then
            echo "Changed/Added:"
            echo "$CHANGED_DIRS"
          fi
          if [ -n "$DELETED_NAMES" ]; then
            echo "Deleted: $DELETED_NAMES"
          fi

      - name: Generate migration SQL
        id: generate
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          MIGRATION_FILE="migration_${VERSION}.sql"

          cd scripts

          if [ "${{ steps.changed.outputs.all_templates }}" == "true" ]; then
            go run generate-migration.go \
              --all \
              --output /tmp/$MIGRATION_FILE \
              --version $VERSION \
              --commit-sha ${{ github.sha }}
          else
            # Build command with optional --deleted flag
            DELETED_ARG=""
            if [ -n "${{ steps.changed.outputs.deleted_templates }}" ]; then
              DELETED_ARG="--deleted '${{ steps.changed.outputs.deleted_templates }}'"
            fi

            go run generate-migration.go \
              --changed '${{ steps.changed.outputs.changed_templates }}' \
              $DELETED_ARG \
              --output /tmp/$MIGRATION_FILE \
              --version $VERSION \
              --commit-sha ${{ github.sha }}
          fi

          echo "migration_file=$MIGRATION_FILE" >> $GITHUB_OUTPUT
          echo "✅ Migration SQL generated: $MIGRATION_FILE"

          echo "### Generated Migration SQL" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          head -50 /tmp/$MIGRATION_FILE >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Setup SSH
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H launchpad.kr >> ~/.ssh/known_hosts

      - name: Upload migration to server
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          MIGRATION_FILE="${{ steps.generate.outputs.migration_file }}"

          # 서버에 migration 디렉토리 생성
          ssh ubuntu@launchpad.kr "mkdir -p ~/container-templates/migrations"

          # 마이그레이션 파일 업로드
          scp /tmp/$MIGRATION_FILE ubuntu@launchpad.kr:~/container-templates/migrations/

          echo "✅ Migration file uploaded to server"

      - name: Apply migration to MySQL
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          MIGRATION_FILE="${{ steps.generate.outputs.migration_file }}"

          # MySQL에 마이그레이션 적용 (UTF-8 인코딩 사용)
          ssh ubuntu@launchpad.kr "\
            sudo bash -c 'source /home/ubuntu/mysql/.env && \
            docker exec -i mysql mysql -u root -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 \$MYSQL_DATABASE < /home/ubuntu/container-templates/migrations/$MIGRATION_FILE'"

          echo "✅ Migration applied to MySQL successfully"

      - name: Verify migration
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          # active 템플릿 수 확인
          ACTIVE_COUNT=$(ssh ubuntu@launchpad.kr "\
            sudo bash -c 'source /home/ubuntu/mysql/.env && \
            docker exec mysql mysql -u root -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 -N \$MYSQL_DATABASE -e \"SELECT COUNT(*) FROM TEMPLATES WHERE status=\\\"active\\\";\"'")

          # deprecated 템플릿 수 확인
          DEPRECATED_COUNT=$(ssh ubuntu@launchpad.kr "\
            sudo bash -c 'source /home/ubuntu/mysql/.env && \
            docker exec mysql mysql -u root -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 -N \$MYSQL_DATABASE -e \"SELECT COUNT(*) FROM TEMPLATES WHERE status=\\\"deprecated\\\";\"'")

          # inactive 템플릿 수 확인
          INACTIVE_COUNT=$(ssh ubuntu@launchpad.kr "\
            sudo bash -c 'source /home/ubuntu/mysql/.env && \
            docker exec mysql mysql -u root -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 -N \$MYSQL_DATABASE -e \"SELECT COUNT(*) FROM TEMPLATES WHERE status=\\\"inactive\\\";\"'")

          # 최근 추가/수정된 템플릿 확인
          RECENT_TEMPLATES=$(ssh ubuntu@launchpad.kr "\
            sudo bash -c 'source /home/ubuntu/mysql/.env && \
            docker exec mysql mysql -u root -p\"\$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 -N \$MYSQL_DATABASE -e \"SELECT template_id, name, status FROM TEMPLATES ORDER BY template_id DESC LIMIT 5;\"'")

          echo "### Migration Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Active | $ACTIVE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Deprecated | $DEPRECATED_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Inactive | $INACTIVE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recent templates:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$RECENT_TEMPLATES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "✅ Migration verification complete"

      - name: Deployment summary
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Migration Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`${{ steps.generate.outputs.migration_file }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Applied to: production MySQL (web_console database)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Successfully deployed" >> $GITHUB_STEP_SUMMARY

      - name: No changes to deploy
        if: steps.changed.outputs.has_changes != 'true'
        run: |
          echo "### No Deployment Needed" >> $GITHUB_STEP_SUMMARY
          echo "No template changes detected in this push" >> $GITHUB_STEP_SUMMARY
